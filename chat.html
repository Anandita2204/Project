<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Campusly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="chat-page">
    <div class="chat-container">
        <!-- Conversations List -->
        <aside class="conversations-panel" id="conversations-panel">
            <div class="conversations-header">
                <a href="browse.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h2>Messages</h2>
                <button class="new-chat-btn" title="New Message">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
            
            <div class="conversations-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search conversations..." id="conversation-search">
            </div>
            
            <div class="conversations-list" id="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area" id="chat-area">
            <!-- Empty State -->
            <div class="chat-empty" id="chat-empty">
                <div class="empty-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h3>Select a conversation</h3>
                <p>Choose from your existing conversations or start a new one</p>
            </div>

            <!-- Active Chat -->
            <div class="chat-active" id="chat-active" style="display: none;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button class="back-to-list" id="back-to-list">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-user-info">
                        <img src="" alt="User" id="chat-user-avatar">
                        <div>
                            <h4 id="chat-user-name">User Name</h4>
                            <span id="chat-user-status">Online</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="chat-action-btn" title="View Profile">
                            <i class="fas fa-user"></i>
                        </button>
                        <button class="chat-action-btn" title="More Options">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>

                <!-- Product Reference (if applicable) -->
                <div class="chat-product-ref" id="chat-product-ref" style="display: none;">
                    <img src="" alt="Product" id="ref-product-image">
                    <div class="ref-product-info">
                        <span>Discussing about:</span>
                        <h5 id="ref-product-title">Product Title</h5>
                        <span class="ref-product-price" id="ref-product-price">₹0</span>
                    </div>
                    <a href="#" class="view-product-btn" id="view-product-btn">View</a>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messages-container">
                    <!-- Messages will be loaded here -->
                </div>

                <!-- Chat Input -->
                <div class="chat-input-area">
                    <button class="attachment-btn" title="Attach Image">
                        <i class="fas fa-image"></i>
                    </button>
                    <form class="message-form" id="message-form">
                        <input type="text" placeholder="Type your message..." id="message-input" autocomplete="off">
                        <button type="submit" class="send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
